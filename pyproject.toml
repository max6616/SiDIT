[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sidit"
version = "0.1.1"
description = "Historical SiDIT diffraction point-cloud inference core"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
dependencies = ["numpy", "torch", "timm", "addict", "tqdm"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sidit_public = ["*.json", "vendor_pointcept/LICENSE"]
